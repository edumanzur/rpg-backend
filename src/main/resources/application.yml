spring:
  profiles:
    # Local dev default: running with no env var set boots exactly as
    # before ("local" profile, H2). Set SPRING_PROFILES_ACTIVE=prod (e.g.
    # on Koyeb) to switch to Postgres/prod without editing this file.
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    show-sql: true

# JWT key material, shared default for all profiles. Each value may be a
# Spring resource location (classpath:public.key, as used locally) or, in
# prod, the literal PEM text supplied via the JWT_PUBLIC_KEY / JWT_PRIVATE_KEY
# env vars (see SecurityConfig#resolveKeyMaterial). Local dev is unaffected
# since the env vars are unset and it falls back to the classpath files.
jwt:
  public:
    key: ${JWT_PUBLIC_KEY:classpath:public.key}
  private:
    key: ${JWT_PRIVATE_KEY:classpath:private.key}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}